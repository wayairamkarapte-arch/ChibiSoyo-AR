<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ChibiSoyo AR 表示テスト</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #status { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000; padding: 10px 14px; border-radius: 8px; background: rgba(0,0,0,.65); color: white; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="status">カメラを起動し、パッケージ画像を映してください</div>
  <a-scene
    mindar-image="imageTargetSrc: ./ChibiSoyo_package.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <!-- Image target center; box protrudes toward the camera. -->
      <a-box position="0 0 0.25" width="0.45" height="0.45" depth="0.45"
             material="color: #ff1744; opacity: 1; side: double"
             rotation="0 25 0"></a-box>
    </a-entity>
  </a-scene>
  <script>
    const status = document.getElementById('status');
    const target = document.getElementById('target');
    target.addEventListener('targetFound', () => {
      status.textContent = '認識成功！ 赤い立方体が画像に追従するか確認してください';
    });
    target.addEventListener('targetLost', () => {
      status.textContent = '認識が外れました。画像をもう一度映してください';
    });
    document.querySelector('a-scene').addEventListener('arError', () => {
      status.textContent = 'カメラを起動できません。HTTPSとカメラ許可を確認してください';
    });
  </script>
</body>
</html>
